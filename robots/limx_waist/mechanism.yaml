  - name: pitch
    position: [0.0, 0.0, 0.0]
    axis: [0.0, -1.0, 0.0]
    limits: [-0.524, 0.785]
  - name: roll
    position: [0.0, 0.0, 0.0]
    axis: [-1.0, 0.0, 0.0]
    limits: [-0.524, 0.524]
branches:
  A:
    motor:
      position: [0.0, 0.0934, 0.064]
      axis: [0.0, 1.0, 0.0]
      limits: [-0.785, 0.524]
    crank_tip: [0.063899, 0.06, 0.040743]
    platform_anchor: [0.0639, 0.06, -0.0233]
    rod_length: 0.06404300000780726
  B:
